# Despliegue del backend mínimo en Render.
#
# El servicio existente «socracia» servía la **app Expo en modo web**, no la
# API: cualquier ruta devolvía el HTML del cliente. Aquí se declara el servicio
# que sí ejecuta `apps/api`.
#
# Render lee este archivo al crear el Blueprint. Si el servicio se crea a mano
# desde el panel, hay que respetar estos mismos valores.
services:
  - type: web
    name: socracia-api
    runtime: node
    plan: free
    branch: main
    # El monorepo se construye desde la raíz: `@socracia/api` depende de
    # `@socracia/core`, que es un paquete del workspace.
    buildCommand: npm ci --no-audit --no-fund && npm run build --workspace @socracia/core && npm run build --workspace @socracia/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Persistencia del progreso en un fichero JSON. Sin `DATA_FILE` el
      # almacén vive en memoria y el progreso se pierde al reiniciar.
      - key: DATA_FILE
        value: /var/data/progreso.json
    # AVISO: el disco persistente exige un plan de pago (el gratuito no lo
    # admite) y el plan gratuito suspende el servicio tras un rato sin tráfico,
    # con lo que el primer acceso tarda en responder. Para producción real:
    # suba `plan` a `starter` y descomente el bloque `disk`.
    # disk:
    #   name: socracia-datos
    #   mountPath: /var/data
    #   sizeGB: 1
